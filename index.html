<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />

    <title>Avolane — Automatisierungen für den Mittelstand | Mainz</title>
    <meta
      name="description"
      content="Avolane aus Mainz übernimmt wiederkehrende Abläufe im Mittelstand: Anfragen, Termine, E-Mails, Nachfassen. Weniger Aufwand. Mehr Wachstum."
    />
    <link rel="canonical" href="https://avolane.de/" />
    <meta name="robots" content="index, follow" />

    <!-- Icons. Die .ico trägt 16/32/48 in einer Datei, weil Browser je nach
         Kontext unterschiedliche Größen anfragen. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph. Absolute URL beim Bild ist Pflicht: die Scraper der
         Netzwerke lösen relative Pfade nicht auf. -->
    <meta property="og:title" content="Avolane — Automatisierungen für den Mittelstand | Mainz" />
    <meta
      property="og:description"
      content="Avolane aus Mainz übernimmt wiederkehrende Abläufe im Mittelstand: Anfragen, Termine, E-Mails, Nachfassen. Weniger Aufwand. Mehr Wachstum."
    />
    <meta property="og:image" content="https://avolane.de/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avolane — Weniger Aufwand. Mehr Wachstum." />
    <meta property="og:url" content="https://avolane.de/" />
    <meta property="og:site_name" content="Avolane" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Strukturierte Daten. Bewusst nur Angaben, die auch auf der Seite
      stehen: Anschrift, E-Mail und USt-IdNr. stammen aus dem Impressum,
      die Beschreibung ist die Meta-Description. Keine Telefonnummer —
      es gibt auf der Website keine.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Avolane",
        "url": "https://avolane.de/",
        "description": "Avolane aus Mainz übernimmt wiederkehrende Abläufe im Mittelstand: Anfragen, Termine, E-Mails, Nachfassen. Weniger Aufwand. Mehr Wachstum.",
        "image": "https://avolane.de/og.png",
        "email": "hallo@avolane.de",
        "vatID": "DE342681761",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Am Stollhenn 12",
          "postalCode": "55120",
          "addressLocality": "Mainz",
          "addressCountry": "DE"
        },
        "founder": {
          "@type": "Person",
          "name": "Patrick Grüßhaber"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
