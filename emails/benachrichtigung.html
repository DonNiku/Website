<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Neue Buchung</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0a0a0b; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

    <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
      {{name}} — {{datum}}, {{uhrzeit}} Uhr
    </div>

    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#0a0a0b" style="border-collapse:collapse; background-color:#0a0a0b;">
      <tr>
        <td align="center" style="padding:0;">

          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse; width:100%; max-width:600px;">

            <tr>
              <td bgcolor="#7C3AED" height="4" style="background-color:#7C3AED; height:4px; line-height:4px; font-size:4px;">&nbsp;</td>
            </tr>

            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:32px 28px 0 28px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                  <tr>
                    <td align="left" style="font-family:Helvetica,Arial,sans-serif; font-size:24px; line-height:24px; font-weight:bold; letter-spacing:-0.3px; color:#ededef;">
                      av<span style="color:#7C3AED;">o</span>lane
                    </td>
                    <td align="right" style="font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      Intern
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:32px 28px 0 28px; font-family:Helvetica,Arial,sans-serif; font-size:24px; line-height:30px; font-weight:bold; letter-spacing:-0.4px; color:#ededef;">
                Neue Buchung<span style="color:#7C3AED;">.</span>
              </td>
            </tr>

            <!-- Datenblock: eine Zeile je Feld, Beschriftung über dem Wert -->
            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:26px 28px 0 28px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#101012" style="border-collapse:collapse; background-color:#101012; border:1px solid #24242a;">

                  <tr>
                    <td style="padding:18px 24px 0 24px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      Termin
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 24px 18px 24px; font-family:Helvetica,Arial,sans-serif; font-size:17px; line-height:24px; font-weight:bold; color:#ededef;">
                      {{datum}}, {{uhrzeit}} Uhr
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:0 24px;">
                      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                        <tr><td bgcolor="#24242a" height="1" style="background-color:#24242a; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:18px 24px 0 24px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      Name
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 24px 18px 24px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:24px; color:#ededef;">
                      {{name}}
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:0 24px;">
                      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                        <tr><td bgcolor="#24242a" height="1" style="background-color:#24242a; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:18px 24px 0 24px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      E-Mail
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 24px 18px 24px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:24px; color:#ededef; word-break:break-all;">
                      <a href="mailto:{{email}}" style="color:#a78bfa; text-decoration:none;">{{email}}</a>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:0 24px;">
                      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                        <tr><td bgcolor="#24242a" height="1" style="background-color:#24242a; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:18px 24px 0 24px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      Telefon
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 24px 18px 24px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:24px; color:#ededef;">
                      {{telefon}}
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:0 24px;">
                      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                        <tr><td bgcolor="#24242a" height="1" style="background-color:#24242a; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td style="padding:18px 24px 0 24px; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:16px; letter-spacing:2px; color:#8b8b94; text-transform:uppercase;">
                      Nachricht
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:4px 24px 20px 24px; font-family:Helvetica,Arial,sans-serif; font-size:16px; line-height:26px; color:#ededef;">
                      {{nachricht}}
                    </td>
                  </tr>

                </table>
              </td>
            </tr>

            <!-- Direkte Antwort an den Kunden -->
            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:26px 28px 0 28px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                  <tr>
                    <td align="center" bgcolor="#7C3AED" style="background-color:#7C3AED; padding:14px 26px;">
                      <a href="mailto:{{email}}" style="display:inline-block; font-family:Helvetica,Arial,sans-serif; font-size:13px; line-height:16px; font-weight:bold; letter-spacing:1.5px; text-transform:uppercase; color:#ffffff; text-decoration:none;">
                        Direkt antworten
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:32px 28px 0 28px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
                  <tr><td bgcolor="#24242a" height="1" style="background-color:#24242a; height:1px; line-height:1px; font-size:1px;">&nbsp;</td></tr>
                </table>
              </td>
            </tr>
            <tr>
              <td bgcolor="#0a0a0b" style="background-color:#0a0a0b; padding:20px 28px 40px 28px; font-family:Helvetica,Arial,sans-serif; font-size:12px; line-height:20px; color:#5f5f68;">
                Systemnachricht von avolane.de — ausgelöst durch das Buchungsformular.
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>

  </body>
</html>
